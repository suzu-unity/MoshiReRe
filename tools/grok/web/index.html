<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoshiReRe Grok 4.5</title>
  <style>
    :root { color-scheme: dark; --bg:#10131a; --panel:#191e29; --line:#303848; --text:#edf2f7; --muted:#9da8b8; --accent:#8bd5ca; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top right,#27384a 0,#10131a 42%); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(980px,100%); min-height:100vh; margin:auto; display:flex; flex-direction:column; padding:22px; gap:14px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { font-size:20px; margin:0; letter-spacing:.02em; }
    .status { color:var(--muted); font-size:12px; }
    .toolbar { display:flex; gap:8px; align-items:center; }
    select,button,textarea { font:inherit; color:inherit; }
    select,button { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:8px 11px; }
    button { cursor:pointer; } button:hover { border-color:var(--accent); } button:disabled { opacity:.5; cursor:wait; }
    #messages { flex:1; min-height:55vh; display:flex; flex-direction:column; gap:12px; padding:4px 0; overflow:auto; }
    .bubble { max-width:86%; padding:12px 15px; border:1px solid var(--line); border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .user { align-self:flex-end; background:#214047; border-color:#35666a; } .assistant { align-self:flex-start; background:var(--panel); }
    .empty { margin:auto; color:var(--muted); text-align:center; }
    form { display:flex; gap:10px; align-items:flex-end; } textarea { flex:1; resize:vertical; min-height:72px; max-height:260px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; outline:none; } textarea:focus { border-color:var(--accent); }
    #send { min-width:74px; min-height:48px; background:var(--accent); color:#102321; border-color:transparent; font-weight:700; }
    .note { color:var(--muted); font-size:12px; margin:0; }
    @media (max-width:600px) { main { padding:14px; } .bubble { max-width:94%; } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>MoshiReRe / Grok 4.5</h1><div class="status" id="status">ローカルサーバー経由で接続</div></div>
      <div class="toolbar"><label for="effort">推論</label><select id="effort"><option value="">環境設定</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select><button id="clear" type="button">クリア</button></div>
    </header>
    <section id="messages" aria-live="polite"><div class="empty">メッセージを入力してください。APIキーはこの画面には渡りません。</div></section>
    <form id="chat-form"><textarea id="input" placeholder="Grokに相談する… (Ctrl+Enterで送信)" required></textarea><button id="send" type="submit">送信</button></form>
    <p class="note">APIキーはPythonサーバーの <code>XAI_API_KEY</code> だけで読み込みます。ブラウザの開発者ツールやURLには表示しません。</p>
  </main>
  <script>
    const messagesEl = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const form = document.querySelector('#chat-form');
    const send = document.querySelector('#send');
    const statusEl = document.querySelector('#status');
    const effort = document.querySelector('#effort');
    const conversationId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
    const messages = [];

    function render() {
      messagesEl.replaceChildren();
      if (!messages.length) { const empty = document.createElement('div'); empty.className='empty'; empty.textContent='メッセージを入力してください。APIキーはこの画面には渡りません。'; messagesEl.append(empty); return; }
      for (const message of messages) { const bubble=document.createElement('div'); bubble.className=`bubble ${message.role}`; bubble.textContent=message.content; messagesEl.append(bubble); }
      messagesEl.scrollTop=messagesEl.scrollHeight;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); const content=input.value.trim(); if (!content || send.disabled) return;
      messages.push({role:'user',content}); input.value=''; render(); send.disabled=true; statusEl.textContent='Grok 4.5に問い合わせ中…';
      try {
        const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,conversation_id:conversationId,reasoning_effort:effort.value||undefined})});
        const data=await response.json(); if (!response.ok || !data.ok) throw new Error(data.error||`HTTP ${response.status}`);
        messages.push({role:'assistant',content:data.text}); render(); statusEl.textContent=`接続中 / ${data.model||'grok-4.5'}`;
      } catch (error) { messages.pop(); render(); statusEl.textContent=`エラー: ${error.message}`; }
      finally { send.disabled=false; input.focus(); }
    });
    input.addEventListener('keydown',(event)=>{ if(event.ctrlKey && event.key==='Enter') form.requestSubmit(); });
    document.querySelector('#clear').addEventListener('click',()=>{ messages.length=0; render(); statusEl.textContent='ローカルサーバー経由で接続'; input.focus(); });
  </script>
</body>
</html>
